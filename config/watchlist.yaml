# =============================================================================
# СПИСОК ІНСТРУМЕНТІВ ДЛЯ СКАНУВАННЯ
#
# provider:
#   - "yfinance"  — акції, ф'ючерси, форекс (безкоштовно, без ключа, "майже реальний час")
#   - "coinbase"  — криптовалюта (безкоштовно, без ключа, справжній реальний час)
#   - "alpaca"    — акції (потрібен безкоштовний ключ, справжній реальний час, розділ README)
#   - "twelvedata"— форекс/акції (потрібен безкоштовний ключ, ліміт запитів)
#
# point_value — розмір "пункту" в $ (розділ 3.3 Стратегії 2):
#   акції: 0.01 (цент) · форекс: 0.0001 (0.01 для пар з єною) · ф'ючерси: розмір тіку контракту
#   крипто: приблизна величина залежно від порядку ціни монети (див. коментар у розділі crypto)
#
# enabled_strategies — список strategy_id, якщо потрібно обмежити стратегії для
# конкретного інструмента; якщо не вказано — застосовуються всі 8.
# =============================================================================

# -----------------------------------------------------------------------------
# STOCKS — критерій: ціна $20-60, середній обсяг від 500 000 акцій/день
#
# ⚠️ ЧЕСНО: перевірено пошуком ~20 конкретних тикерів (банки, авіалінії,
# енергетика, ритейл, телеком) станом на сьогодні. Через незвично сильне
# зростання ринку зараз більшість "класичних" $20-60 акцій вилетіли З
# ДІАПАЗОНУ — або значно ВИЩЕ (банки: BAC ~$62, WFC ~$86, C ~$132, DAL ~$70,
# UAL ~$95), або значно НИЖЧЕ (F ~$16, SOFI ~$17, AAL ~$12, NU ~$13).
# Впевнено підтверджено в діапазоні лише 4 позиції нижче.
#
# Це НЕ помилка процесу, а сигнал, що статичний список для $20-60 застаріває
# за лічені дні при такій волатильності — правильне довгострокове рішення:
# скрипт-скринер на yfinance, що перераховує список щодня локально у вас
# (можу додати окремим файлом за запитом). Поки що — 4 перевірених тикери;
# решту місця можна заповнити самостійно або дочекатись скринера.
# -----------------------------------------------------------------------------
stocks:
  - symbol: "CMCSA"
    display_name: "Comcast Corp. (CMCSA)"
    asset_class: stock
    provider: yfinance
    point_value: 0.01

  - symbol: "LUV"
    display_name: "Southwest Airlines Co. (LUV)"
    asset_class: stock
    provider: yfinance
    point_value: 0.01

  - symbol: "OXY"
    display_name: "Occidental Petroleum Corp. (OXY)"
    asset_class: stock
    provider: yfinance
    point_value: 0.01

  - symbol: "CCL"
    display_name: "Carnival Corp. (CCL)"
    asset_class: stock
    provider: yfinance
    point_value: 0.01

futures:
  - symbol: "ES=F"
    display_name: "E-mini S&P 500 (/ES)"
    asset_class: futures
    provider: yfinance
    point_value: 0.25       # мінімальний тік /ES = 0.25 пункту = $12.50

  - symbol: "NQ=F"
    display_name: "E-mini Nasdaq-100 (/NQ)"
    asset_class: futures
    provider: yfinance
    point_value: 0.25

  - symbol: "GC=F"
    display_name: "Золото (/GC)"
    asset_class: futures
    provider: yfinance
    point_value: 0.10

  - symbol: "CL=F"
    display_name: "Нафта WTI (/CL)"
    asset_class: futures
    provider: yfinance
    point_value: 0.01

# -----------------------------------------------------------------------------
# CRYPTO — топ-50 за ринковою капіталізацією (без стейблкоїнів USDT/USDC/DAI/...
# і без wrapped/staked похідних BTC/ETH — вони технічно рухаються 1:1 з
# базовим активом, тому дублюють, а не додають торгових можливостей).
#
# provider: coinbase — публічний REST API Coinbase Exchange, без ключа.
# Ранги 1-21 звірено напряму через live-дані CoinGecko сьогодні; ранги 22-50 —
# з високою впевненістю за загальновідомою стабільною приналежністю до топ-50
# (без live-звірки кожного — за потреби можу звірити окремим проходом).
# point_value підібраний під порядок ціни монети — орієнтовний, коригуйте
# за потреби, суттєво на розрахунки не впливає (домінує ATR-стоп).
#
# Коли повернемось на Binance/Bybit: змінити provider на "binance"/"bybit" і
# symbol на їхній формат (напр. "BTCUSDT" замість "BTC-USD"), після реалізації
# відповідного провайдера в bot/data/ — решта конфігурації не зміниться.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# FOREX — лише мажорні пари (USD проти 6 інших головних валют: EUR, JPY, GBP,
# CHF, CAD, AUD, NZD). Це стабільний, загальновідомий список — саме мажори
# мають найвищу ліквідність і, відповідно, найменший спред серед усіх пар.
# -----------------------------------------------------------------------------
forex:
  - symbol: "EURUSD=X"
    display_name: "EUR/USD"
    asset_class: forex
    provider: yfinance
    point_value: 0.0001

  - symbol: "USDJPY=X"
    display_name: "USD/JPY"
    asset_class: forex
    provider: yfinance
    point_value: 0.01


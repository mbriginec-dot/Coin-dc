# =============================================================================
# СПИСОК ІНСТРУМЕНТІВ ДЛЯ СКАНУВАННЯ
#
# provider:
#   - "yfinance"  — акції, ф'ючерси, форекс (безкоштовно, без ключа, "майже реальний час")
#   - "binance"   — криптовалюта (безкоштовно, без ключа, справжній реальний час)
#   - "alpaca"    — акції (потрібен безкоштовний ключ, справжній реальний час, розділ README)
#   - "twelvedata"— форекс/акції (потрібен безкоштовний ключ, ліміт запитів)
#
# point_value — розмір "пункту" в $ (розділ 3.3 Стратегії 2):
#   акції: 0.01 (цент) · форекс: 0.0001 (0.01 для пар з єною) · ф'ючерси: розмір тіку контракту
#
# enabled_strategies — список strategy_id, якщо потрібно обмежити стратегії для
# конкретного інструмента; якщо не вказано — застосовуються всі 8.
# =============================================================================

stocks:
  - symbol: "AAPL"
    display_name: "Apple Inc. (AAPL)"
    asset_class: stock
    provider: yfinance
    point_value: 0.01

  - symbol: "MSFT"
    display_name: "Microsoft Corp. (MSFT)"
    asset_class: stock
    provider: yfinance
    point_value: 0.01

  - symbol: "NVDA"
    display_name: "NVIDIA Corp. (NVDA)"
    asset_class: stock
    provider: yfinance
    point_value: 0.01

  - symbol: "TSLA"
    display_name: "Tesla Inc. (TSLA)"
    asset_class: stock
    provider: yfinance
    point_value: 0.01

futures:
  - symbol: "ES=F"
    display_name: "E-mini S&P 500 (/ES)"
    asset_class: futures
    provider: yfinance
    point_value: 0.25       # мінімальний тік /ES = 0.25 пункту = $12.50

  - symbol: "NQ=F"
    display_name: "E-mini Nasdaq-100 (/NQ)"
    asset_class: futures
    provider: yfinance
    point_value: 0.25

  - symbol: "GC=F"
    display_name: "Золото (/GC)"
    asset_class: futures
    provider: yfinance
    point_value: 0.10

  - symbol: "CL=F"
    display_name: "Нафта WTI (/CL)"
    asset_class: futures
    provider: yfinance
    point_value: 0.01

crypto:
  # provider: coinbase — публічний REST API Coinbase Exchange, без ключа для ринкових
  # даних. Тикери у форматі "BASE-QUOTE" (не "BTCUSDT", як на Binance/Bybit).
  # Коли повернемось на Binance/Bybit: змінити provider на "binance"/"bybit" і
  # symbol на їхній формат (напр. "BTCUSDT"), після реалізації відповідного
  # провайдера в bot/data/ — решта конфігурації не зміниться.
  - symbol: "BTC-USD"
    display_name: "Bitcoin / USD (Coinbase)"
    asset_class: crypto
    provider: coinbase
    point_value: 0.01

  - symbol: "ETH-USD"
    display_name: "Ethereum / USD (Coinbase)"
    asset_class: crypto
    provider: coinbase
    point_value: 0.01

  - symbol: "SOL-USD"
    display_name: "Solana / USD (Coinbase)"
    asset_class: crypto
    provider: coinbase
    point_value: 0.001

forex:
  - symbol: "EURUSD=X"
    display_name: "EUR/USD"
    asset_class: forex
    provider: yfinance
    point_value: 0.0001

  - symbol: "GBPUSD=X"
    display_name: "GBP/USD"
    asset_class: forex
    provider: yfinance
    point_value: 0.0001

  - symbol: "USDJPY=X"
    display_name: "USD/JPY"
    asset_class: forex
    provider: yfinance
    point_value: 0.01

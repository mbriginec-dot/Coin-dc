name: Crypto Signal Scan

on:
  schedule:
    # Кожні 15 хвилин. Змінюй cron, якщо треба частіше/рідше
    # (звертай увагу на ліміти безкоштовних хвилин GitHub Actions).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # дозволяє запустити вручну кнопкою в GitHub

permissions:
  contents: write  # потрібно, щоб бот міг закомітити оновлений state.json назад у репозиторій

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state.json
        run: |
          git config user.name "crypto-signal-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update bot state [skip ci]"
          git push

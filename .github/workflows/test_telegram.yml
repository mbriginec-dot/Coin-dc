name: Тест Telegram (діагностика)

# Окремий легкий workflow — лише перевіряє, чи працює зв'язок з Telegram,
# без повного сканування watchlist. Запускати вручну через "Run workflow".

"on":
  workflow_dispatch: {}

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout репозиторію
        uses: actions/checkout@v4

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Показати структуру репозиторію (діагностика)
        run: |
          echo "Поточна директорія:"
          pwd
          echo "===================================================="
          echo "Вміст кореня репозиторію:"
          ls -la
          echo "===================================================="
          echo "Чи існує main.py?"
          test -f main.py && echo "так, main.py знайдено" || echo "!!! main.py ВІДСУТНІЙ у корені репозиторію !!!"
          echo "===================================================="
          echo "Чи існує bot/config.py?"
          test -f bot/config.py && echo "так, bot/config.py знайдено" || echo "!!! bot/config.py ВІДСУТНІЙ !!!"

      - name: Встановити залежності
        run: pip install -r requirements.txt

      - name: Надіслати тестове повідомлення (з повною діагностикою)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python main.py --test-telegram
          EXIT_CODE=$?
          echo "===================================================="
          echo "КОД ЗАВЕРШЕННЯ python main.py --test-telegram: $EXIT_CODE"
          echo "===================================================="
          echo "Поточна директорія:"
          pwd
          echo "===================================================="
          echo "Вміст директорії data/ (якщо існує):"
          ls -la data/ 2>&1 || echo "директорія data/ НЕ існує"
          echo "===================================================="
          echo "Вміст data/bot.log (якщо існує):"
          cat data/bot.log 2>&1 || echo "файл data/bot.log НЕ знайдено"
          echo "===================================================="
          exit 0

# =============================================================================
# НАЛАШТУВАННЯ РИЗИКУ ТА СКАНУВАННЯ
# Значення за замовчуванням відповідають формулам з файлів
# "Калькулятор_*.xlsx" та документа "Торговий алгоритм трейдера".
# =============================================================================

risk:
  # --- Депозит і ризик (розділ 8.2 "Торгового алгоритму трейдера") ---
  deposit: 10000.0
  risk_per_trade_pct: 0.005        # 0.5% від депозиту на угоду (діапазон методики: 0.1-1%)

  # --- Люфт для моделі "Відбій" (Стратегія 1, розділ 3.2) ---
  luft_pct_of_stop: 0.20           # ≈20% розміру стопу

  # --- Співвідношення прибуток/ризик (мінімум 3:1 для всіх стратегій) ---
  rr_tp1: 3.0
  rr_tp2: 4.0
  rr_tp3: 5.0
  tp1_share: 0.50
  tp2_share: 0.25
  tp3_share: 0.25
  breakeven_at_r: 2.0              # перенос стопу в беззбиток після проходження 2R

  # --- Стратегія 2 "Пробій рівня": відступ входу і 4 методи стопу (розділ 6-7) ---
  breakout_offset_points_min: 2
  breakout_offset_points_max: 5
  breakout_stop_pct_of_price: 0.002    # метод 1: 0.2% від ціни
  breakout_stop_points_min: 15         # метод 2: 15-25 пунктів
  breakout_stop_points_max: 25
  breakout_atr_multiplier: 0.3          # метод 3: ATR * коефіцієнт

  # --- Стратегія 3 "Хибний пробій": буфер і відступ (розділ 6.3) ---
  false_breakout_offset_points: 2
  false_breakout_buffer_points: 2

  # --- Стратегія 5 "Торгівля в каналі" (розділи 3-4) ---
  channel_min_width_stops: 6.0
  channel_wide_threshold_stops: 15.0
  channel_min_room_stops: 4.0

  # --- Загальне правило ATR (розділ 3.4 алгоритму): 75-80% = рух вичерпано ---
  atr_exhausted_pct: 0.75

  # --- Ключові рівні дня: поріг конфлюенсу в стопах (розділ 5.1) ---
  confluence_threshold_stops: 1.0

  # --- Стратегія 4 "Різкий імпульс": гep-фільтр ≈0.5% (розділ 9.1) ---
  momentum_max_gap_pct: 0.005

  # --- Стратегія 7 "Поглинання": мінімум барів формації ---
  engulfing_min_bars: 3

scan:
  poll_interval_minutes: 5
  daily_atr_lookback_days: 14      # ATR за 5-14 днів (розділ 3.4 алгоритму)
  daily_atr_min_days: 5
  anomaly_range_multiplier: 2.5    # автофільтр "паранормальних" барів для ATR (аналог ручного Так/Ні в Excel)
  swing_lookback_bars: 3           # фрактал для автоматичного визначення рівнів (N барів зліва/справа)
  level_merge_tolerance_pct: 0.001 # рівні ближче цього % між собою зливаються в один

=============================================================================
# КОМІСІЇ ТА ПРОСЛИЗАННЯ
#
# ВАЖЛИВО: жоден із вихідних документів (Стратегія_1..7, калькулятори .xlsx)
# не містить реальних тарифів конкретного брокера — там лише поле для
# РУЧНОГО введення ("Комісія + прослизання (за угоду), $"). Значення нижче —
# ЗАГЛУШКИ (0 або типова структура тарифу), а НЕ реальні комісії жодного
# брокера. Обов'язково впишіть сюди актуальні тарифи саме вашого брокера/біржі
# перед реальною торгівлею — бот підставляє ці цифри в підсумковий сигнал,
# але не бере на себе жодної гарантії їх точності.
#
# Формат для кожного класу активів — оберіть модель, що відповідає вашому
# брокеру, і заповніть суму. Бот бере "per_trade_usd" як підсумкову оцінку
# (аналог клітинки "Комісія + прослизання" в калькуляторах).
# =============================================================================

stock:
  model: "per_share"          # per_share | per_trade | percent
  per_share_usd: 0.0
  per_trade_usd: 0.0
  percent_of_notional: 0.0
  notes: "Впишіть тариф вашого брокера (напр. IBKR: ~$0.005/акцію, мінімум $1/угоду)"

futures:
  model: "per_contract"       # per_contract | per_trade
  per_contract_usd: 0.0
  per_trade_usd: 0.0
  notes: "Впишіть комісію за контракт вашого брокера (напр. round-turn на /ES, /NQ тощо)"

crypto:
  model: "percent_taker"      # percent_maker | percent_taker | per_trade
  percent_maker: 0.0
  percent_taker: 0.0
  per_trade_usd: 0.0
  notes: "Впишіть maker/taker % вашої біржі (напр. Coinbase Advanced Trade — тарифна сітка залежить від обсягу; Binance/Bybit — типово 0.1% спот без знижок/VIP)"

forex:
  model: "spread"             # spread (враховується курсом) | per_lot | percent
  per_lot_usd: 0.0
  typical_spread_pips: 0.0
  notes: "У форекс основна вартість — спред, а не пряма комісія (розділ 6.3 'Торговий алгоритм: Форекс'); впишіть типовий спред вашого брокера в пунктах або комісію за лот, якщо брокер ECN"

# За потреби — індивідуальний override для конкретного тикера (перекриває клас активу вище)
per_symbol_override: {}
# приклад:
# per_symbol_override:
#   AAPL:
#     model: per_trade
#     per_trade_usd: 1.0
